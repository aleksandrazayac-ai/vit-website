# Конфигурация деплоя на Netlify
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."
  # Статический сайт — сборка не требуется

[build.environment]
  NODE_VERSION = "20"

# Главная: / отдаёт контент pages/index.html (URL в браузере остаётся /)
[[redirects]]
  from = "/"
  to = "/pages/index.html"
  status = 200

# Канонический URL главной — / (не /pages/index.html и не /index.html)
[[redirects]]
  from = "/pages/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Страница успешной отправки формы Netlify (если не используется AJAX)
[[redirects]]
  from = "/thanks"
  to = "/pages/contacts.html"
  status = 200

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
