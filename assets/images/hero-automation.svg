<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" fill="none" role="img" aria-label="Автоматизация бизнеса: ERP, склад, касса, документы и облако">
  <defs>
    <linearGradient id="ha-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="ha-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#2563eb" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="ha-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ha-card-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563eb" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    @keyframes ha-float-laptop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes ha-float-a {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(0, -5px); }
    }
    @keyframes ha-float-b {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(3px, -4px); }
    }
    @keyframes ha-float-c {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-4px, 3px); }
    }
    @keyframes ha-float-d {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(5px, 4px); }
    }
    @keyframes ha-float-e {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-3px, -6px); }
    }
    @keyframes ha-float-f {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(4px, -3px); }
    }
    @keyframes ha-line-pulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    @keyframes ha-ring-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .ha-laptop { animation: ha-float-laptop 8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ha-mod-a { animation: ha-float-a 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ha-mod-b { animation: ha-float-b 9s ease-in-out infinite; animation-delay: 0.8s; transform-box: fill-box; transform-origin: center; }
    .ha-mod-c { animation: ha-float-c 6.5s ease-in-out infinite; animation-delay: 1.2s; transform-box: fill-box; transform-origin: center; }
    .ha-mod-d { animation: ha-float-d 8.5s ease-in-out infinite; animation-delay: 0.4s; transform-box: fill-box; transform-origin: center; }
    .ha-mod-e { animation: ha-float-e 10s ease-in-out infinite; animation-delay: 1.6s; transform-box: fill-box; transform-origin: center; }
    .ha-mod-f { animation: ha-float-f 7.5s ease-in-out infinite; animation-delay: 2s; transform-box: fill-box; transform-origin: center; }
    .ha-lines { animation: ha-line-pulse 4s ease-in-out infinite; }
    .ha-ring { animation: ha-ring-spin 80s linear infinite; transform-box: fill-box; transform-origin: 480px 380px; }
    @media (prefers-reduced-motion: reduce) {
      .ha-laptop, .ha-mod-a, .ha-mod-b, .ha-mod-c, .ha-mod-d, .ha-mod-e, .ha-mod-f, .ha-lines, .ha-ring { animation: none; }
    }
  </style>

  <g class="ha-ring" opacity="0.45">
    <ellipse cx="480" cy="380" rx="340" ry="260" stroke="#dbeafe" stroke-width="1.5" stroke-dasharray="8 14"/>
    <ellipse cx="480" cy="380" rx="300" ry="228" stroke="#eff6ff" stroke-width="1"/>
  </g>

  <g class="ha-lines">
    <path d="M480 420 C380 400 280 320 200 220" stroke="url(#ha-line)" stroke-width="2" stroke-linecap="round"/>
    <path d="M480 420 C580 400 680 300 760 200" stroke="url(#ha-line)" stroke-width="2" stroke-linecap="round"/>
    <path d="M480 420 C360 440 240 460 140 400" stroke="url(#ha-line)" stroke-width="2" stroke-linecap="round"/>
    <path d="M480 420 C600 440 720 480 820 440" stroke="url(#ha-line)" stroke-width="2" stroke-linecap="round"/>
    <path d="M480 420 C480 320 480 240 480 160" stroke="url(#ha-line)" stroke-width="2" stroke-linecap="round"/>
    <path d="M480 420 C520 520 560 580 600 640" stroke="url(#ha-line)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g class="ha-laptop" filter="url(#ha-soft)">
    <ellipse cx="480" cy="580" rx="220" ry="28" fill="#2563eb" opacity="0.08"/>
    <path d="M220 520 Q480 560 740 520 L760 540 Q480 580 200 540 Z" fill="#e2e8f0"/>
    <rect x="260" y="280" width="440" height="260" rx="16" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="276" y="296" width="408" height="228" rx="10" fill="url(#ha-screen)" stroke="#dbeafe" stroke-width="1"/>
    <rect x="296" y="316" width="120" height="10" rx="5" fill="#2563eb" opacity="0.15"/>
    <rect x="296" y="336" width="180" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="296" y="352" width="140" height="8" rx="4" fill="#eff6ff"/>
    <rect x="296" y="380" width="168" height="112" rx="10" fill="#eff6ff" stroke="#dbeafe" stroke-width="1"/>
    <path d="M320 450 L344 410 L368 432 L392 396 L416 420" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <rect x="480" y="380" width="184" height="52" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="480" y="444" width="184" height="48" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="496" y="396" width="72" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="496" y="412" width="48" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="496" y="460" width="80" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="496" y="476" width="56" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="296" y="508" width="368" height="8" rx="4" fill="#2563eb" opacity="0.35"/>
    <rect x="296" y="524" width="248" height="6" rx="3" fill="#e2e8f0"/>
  </g>

  <g class="ha-mod-a" filter="url(#ha-card-shadow)">
    <rect x="108" y="168" width="132" height="72" rx="16" fill="#fff" stroke="#dbeafe" stroke-width="1"/>
    <rect x="124" y="184" width="36" height="36" rx="10" fill="#eff6ff"/>
    <path d="M134 204h16M134 196h10" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <rect x="124" y="228" width="56" height="6" rx="3" fill="#cbd5e1"/>
    <text x="172" y="210" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b">Склад</text>
  </g>

  <g class="ha-mod-b" filter="url(#ha-card-shadow)">
    <rect x="720" y="152" width="132" height="72" rx="16" fill="#fff" stroke="#dbeafe" stroke-width="1"/>
    <rect x="736" y="168" width="36" height="36" rx="10" fill="#eff6ff"/>
    <rect x="746" y="178" width="16" height="12" rx="3" stroke="#2563eb" stroke-width="1.5" fill="none"/>
    <path d="M748 190h12" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
    <text x="784" y="194" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b">Касса</text>
  </g>

  <g class="ha-mod-c ha-mod-distant" filter="url(#ha-card-shadow)">
    <rect x="48" y="352" width="132" height="72" rx="16" fill="#fff" stroke="#dbeafe" stroke-width="1"/>
    <rect x="64" y="368" width="36" height="36" rx="10" fill="#eff6ff"/>
    <path d="M72 378h20v16H72z" stroke="#2563eb" stroke-width="1.5" fill="none"/>
    <path d="M76 386h12M76 392h8" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
    <text x="112" y="394" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b">Документы</text>
  </g>

  <g class="ha-mod-d" filter="url(#ha-card-shadow)">
    <rect x="404" y="72" width="132" height="72" rx="16" fill="#fff" stroke="#dbeafe" stroke-width="1"/>
    <rect x="420" y="88" width="36" height="36" rx="10" fill="#eff6ff"/>
    <path d="M428 104a12 8 0 0 1 20 0" stroke="#3b82f6" stroke-width="2" fill="none"/>
    <path d="M438 112v8M428 108h20" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
    <text x="468" y="114" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b">Облако</text>
  </g>

  <g class="ha-mod-e ha-mod-distant" filter="url(#ha-card-shadow)">
    <rect x="780" y="368" width="132" height="72" rx="16" fill="#fff" stroke="#dbeafe" stroke-width="1"/>
    <rect x="796" y="384" width="36" height="36" rx="10" fill="#eff6ff"/>
    <path d="M804 408 L812 392 L820 400 L832 384" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="844" y="410" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b">Аналитика</text>
  </g>

  <g class="ha-mod-f" filter="url(#ha-card-shadow)">
    <rect x="392" y="612" width="148" height="72" rx="16" fill="#fff" stroke="#dbeafe" stroke-width="1"/>
    <rect x="408" y="628" width="36" height="36" rx="10" fill="#eff6ff"/>
    <path d="M416 646h20M426 636v20" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <path d="M420 642l6 6 10-10" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="456" y="654" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">Обмен данными</text>
  </g>
</svg>
